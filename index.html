<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flucti</title>
  <link rel="icon" id="favicon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>

    <!-- Pantalla 1: inicio -->
    <section class="screen home" id="home" aria-label="Inicio" data-i18n-aria-label="home.label">
      <div class="clock">
        <p class="greeting" id="greeting"></p>
        <time class="time" id="time" aria-live="off">
          <span id="time-hm">--:--</span><span class="time-s" id="time-s">:--</span>
        </time>
        <p class="date" id="date"></p>

      </div>

      <a class="scroll-hint" href="#tasks" aria-label="Ver tareas" data-i18n-aria-label="scroll.label">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </a>
    </section>

    <!-- Pantalla 2: lista de tareas (hoja) -->
    <section class="screen tasks" id="tasks" aria-label="Tareas" data-i18n-aria-label="tasks.section">
      <!-- Botones de la franja superior, a la altura de la flecha -->
      <div class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="dialog"
                aria-label="Abrir ajustes" data-i18n-aria-label="menu.open">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <button class="icon-btn lang-btn" type="button" data-language-toggle>
          <span class="language-code">ES</span>
        </button>
      </div>

      <div class="tasks-inner">
        <!-- Una tarjeta por lista, con sus tareas dentro (se dibujan desde tasks.js) -->
        <div class="lists-grid" id="lists-grid"></div>
      </div>

      <!-- Versión actual (se cambia en i18n.js: Flucti.version) -->
      <p class="app-version" id="app-version"></p>
    </section>

  </main>

  <!-- Una lista a pantalla completa (se abre pulsando su título) -->
  <section class="list-full" id="list-full" hidden aria-label="Lista" data-i18n-aria-label="list.dialog.title">
    <div class="list-full-body" id="list-full-body"></div>
  </section>

  <!-- Ajustes de la aplicación -->
  <dialog class="modal modal-wide" id="settings-dialog" aria-labelledby="settings-title">
    <div class="modal-body">
      <header class="modal-head">
        <button class="icon-btn" id="settings-back" type="button" hidden aria-label="Volver" data-i18n-aria-label="settings.back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h2 class="modal-title" id="settings-title">Ajustes</h2>
        <button class="icon-btn" id="settings-close" type="button" aria-label="Cerrar" data-i18n-aria-label="dialog.close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="settings-body"></div>
    </div>
  </dialog>

  <!-- Parámetros de una tarea: cerrar la ventana la guarda (sin título se descarta) -->
  <dialog class="modal modal-wide" id="task-dialog" aria-labelledby="task-dialog-title">
    <div class="modal-body">
      <header class="modal-head">
        <h2 class="modal-title" id="task-dialog-title" data-i18n="task.dialog.new">Nueva tarea</h2>
        <button class="icon-btn" id="task-close" type="button" aria-label="Cerrar" data-i18n-aria-label="dialog.close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <p class="modal-sub" id="task-dialog-list"></p>
      <div id="task-kind"></div>
      <div class="task-fields" id="task-fields"></div>
      <p class="form-error" id="task-error" role="alert"></p>
      <button class="primary-btn" id="task-save-btn" type="button" data-i18n="task.saveButton">Guardar</button>
      <button class="text-btn danger" id="task-delete-btn" type="button" hidden>Eliminar tarea</button>
    </div>
  </dialog>

  <!-- Opciones de una lista: nombre, orden, ocultar y eliminar -->
  <dialog class="modal modal-wide" id="list-dialog" aria-labelledby="list-dialog-title">
    <div class="modal-body">
      <header class="modal-head">
        <h2 class="modal-title" id="list-dialog-title" data-i18n="list.dialog.title">Lista</h2>
        <button class="icon-btn" id="list-close" type="button" aria-label="Cerrar" data-i18n-aria-label="dialog.close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="list-body"></div>
    </div>
  </dialog>

  <script src="languages.js"></script>
  <script src="i18n.js"></script>
  <script src="ui.js"></script>
  <script src="tasks.js"></script>
  <script src="script.js"></script>
</body>
</html>
