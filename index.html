<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flucti</title>
  <link rel="icon" id="favicon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>

    <!-- Pantalla 1: inicio -->
    <section class="screen home" id="home" aria-label="Inicio" data-i18n-aria-label="home.label">
      <div class="clock">
        <p class="greeting" id="greeting"></p>
        <time class="time" id="time" aria-live="off">
          <span id="time-hm">--:--</span><span class="time-s" id="time-s">:--</span>
        </time>
        <p class="date" id="date"></p>
      </div>

      <a class="scroll-hint" href="#tasks" aria-label="Ver tareas" data-i18n-aria-label="scroll.label">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </a>
    </section>

    <!-- Pantalla 2: lista de tareas (hoja) -->
    <section class="screen tasks" id="tasks" aria-labelledby="tasks-title">
      <!-- Botones de la franja superior, a la altura de la flecha -->
      <div class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="dialog"
                aria-label="Abrir menú" data-i18n-aria-label="menu.open">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <button class="icon-btn lang-btn" type="button" data-language-toggle>
          <span class="language-code">ES</span>
        </button>
      </div>

      <div class="tasks-inner">
        <h2 class="tasks-title" id="tasks-title" data-i18n="tasks.title">Tareas</h2>

        <form class="add" id="add-form" autocomplete="off">
          <label class="visually-hidden" for="task-input" data-i18n="task.input.label">Nombre de la tarea</label>
          <input class="add-input" id="task-input" type="text" maxlength="120"
                 placeholder="Nombre de la tarea" data-i18n-placeholder="task.input.placeholder">
          <button class="add-btn" type="submit" data-i18n="task.add">Añadir</button>
        </form>

        <ul class="list" id="task-list"></ul>

        <p class="empty" id="empty" hidden data-i18n="task.empty">No tienes tareas pendientes. Escribe una arriba y pulsa Añadir.</p>
      </div>
    </section>

  </main>

  <!-- Ventana del menú (se muestra delante de todo) -->
  <dialog class="modal" id="menu-dialog" aria-label="Menú" data-i18n-aria-label="menu.title">
    <div class="modal-body">
      <button class="icon-btn modal-close" id="menu-close" type="button"
              aria-label="Cerrar" data-i18n-aria-label="menu.close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>

      <!-- Opciones de cuenta, abajo del todo -->
      <div class="menu-actions">
        <button class="menu-item" id="switch-account-btn" type="button" data-i18n="menu.switchAccount">Cambiar de cuenta</button>
        <button class="menu-item" id="sign-out-btn" type="button" data-i18n="menu.signOut">Cerrar sesión</button>
      </div>
    </div>
  </dialog>

  <!-- Inicio de sesión: ocupa toda la pantalla hasta que se entra con una cuenta -->
  <section class="login" id="login" hidden aria-labelledby="login-title">
    <div class="login-card">
      <h1 class="login-title" id="login-title" data-i18n="app.title">Flucti</h1>
      <p class="login-text" id="login-text">Inicia sesión para continuar</p>

      <!-- Acceso con correo y contraseña (el texto de los botones cambia según el modo) -->
      <div class="login-account" id="login-account">
        <form class="login-form" id="login-form" novalidate>
          <label class="visually-hidden" for="login-email" data-i18n="login.email">Correo electrónico</label>
          <input class="field" id="login-email" type="email" inputmode="email" autocomplete="email"
                 autocapitalize="none" spellcheck="false" maxlength="254"
                 placeholder="Correo electrónico" data-i18n-placeholder="login.email">

          <label class="visually-hidden" for="login-password" data-i18n="login.password">Contraseña</label>
          <input class="field" id="login-password" type="password" autocomplete="current-password"
                 placeholder="Contraseña" data-i18n-placeholder="login.password">

          <label class="visually-hidden" id="login-confirm-label" for="login-confirm" hidden
                 data-i18n="login.confirm">Repite la contraseña</label>
          <input class="field" id="login-confirm" type="password" autocomplete="new-password" hidden
                 placeholder="Repite la contraseña" data-i18n-placeholder="login.confirm">

          <button class="primary-btn" id="login-submit" type="submit">Iniciar sesión</button>
        </form>
        <button class="link-btn" id="login-mode-btn" type="button">¿No tienes cuenta? Crear cuenta</button>
      </div>

      <div class="login-dev" id="login-dev" hidden>
        <p class="login-notice" id="login-notice"></p>
        <button class="text-btn" id="login-dev-btn" type="button" data-i18n="login.dev">Entrar en modo de desarrollo</button>
      </div>

      <p class="login-error" id="login-error" role="alert"></p>
      <button class="text-btn" id="login-back" type="button" hidden data-i18n="login.back">Volver</button>
    </div>

    <button class="icon-btn lang-btn login-lang" type="button" data-language-toggle>
      <span class="language-code">ES</span>
    </button>
  </section>

  <script src="languages.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
