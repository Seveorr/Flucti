<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flucti</title>
  <link rel="icon" id="favicon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>

    <!-- Pantalla 1: inicio -->
    <section class="screen home" id="home" aria-label="Inicio" data-i18n-aria-label="home.label">
      <div class="clock">
        <p class="greeting" id="greeting"></p>
        <time class="time" id="time" aria-live="off">
          <span id="time-hm">--:--</span><span class="time-s" id="time-s">:--</span>
        </time>
        <p class="date" id="date"></p>
      </div>

      <a class="scroll-hint" href="#tasks" aria-label="Ver tareas" data-i18n-aria-label="scroll.label">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </a>
    </section>

    <!-- Pantalla 2: lista de tareas (hoja) -->
    <section class="screen tasks" id="tasks" aria-labelledby="tasks-title">
      <!-- Botones de la franja superior, a la altura de la flecha -->
      <div class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="dialog"
                aria-label="Abrir menú" data-i18n-aria-label="menu.open">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <button class="icon-btn lang-btn" id="language-btn" type="button">
          <span id="language-code">ES</span>
        </button>
      </div>

      <div class="tasks-inner">
        <h2 class="tasks-title" id="tasks-title" data-i18n="tasks.title">Tareas</h2>

        <form class="add" id="add-form" autocomplete="off">
          <label class="visually-hidden" for="task-input" data-i18n="task.input.label">Nombre de la tarea</label>
          <input class="add-input" id="task-input" type="text" maxlength="120"
                 placeholder="Nombre de la tarea" data-i18n-placeholder="task.input.placeholder">
          <button class="add-btn" type="submit" data-i18n="task.add">Añadir</button>
        </form>

        <ul class="list" id="task-list"></ul>

        <p class="empty" id="empty" hidden data-i18n="task.empty">No tienes tareas pendientes. Escribe una arriba y pulsa Añadir.</p>
      </div>
    </section>

  </main>

  <!-- Ventana del menú (se muestra delante de todo) -->
  <dialog class="modal" id="menu-dialog" aria-label="Menú" data-i18n-aria-label="menu.title">
    <div class="modal-body">
      <button class="icon-btn modal-close" id="menu-close" type="button"
              aria-label="Cerrar" data-i18n-aria-label="menu.close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </dialog>

  <script src="languages.js"></script>
  <script src="script.js"></script>
</body>
</html>
